<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Quanto</title>
    <meta name="description" content="Vos recettes de cuisine et de pâtisserie, à la bonne mesure." />
    <link rel="icon" href="/quanto/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/quanto/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/quanto/apple-touch-icon-180x180.png" />
    <meta name="theme-color" content="#A84F2D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Quanto" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      try {
        var t = localStorage.getItem('quanto.theme')
        if (t === 'clair' || t === 'sombre') document.documentElement.dataset.theme = t
        var x = localStorage.getItem('quanto.texte')
        if (x === 'grand' || x === 'tres-grand') document.documentElement.dataset.texte = x
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
